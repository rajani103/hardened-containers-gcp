# Binary Authorization project policy (PROJECT_ID is replaced by the scripts).
# An image must carry BOTH attestations:
#   built-by-cloud-build : provenance, created automatically by Cloud Build
#   vulnz-attestor       : our KMS-signed "passed the vulnerability gate"
# globalPolicyEvaluationMode: ENABLE exempts Google-maintained system images.
globalPolicyEvaluationMode: ENABLE
defaultAdmissionRule:
  evaluationMode: REQUIRE_ATTESTATION
  enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG
  requireAttestationsBy:
    - projects/PROJECT_ID/attestors/built-by-cloud-build
    - projects/PROJECT_ID/attestors/vulnz-attestor
name: projects/PROJECT_ID/policy
